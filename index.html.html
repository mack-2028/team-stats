<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team stats (live)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--panel:#fff;--ink:#14202b;--mute:#5b6b78;--line:#d6dee3;--bar:#bfe3dc;--acc:#0f7b6c;--warn:#fff4d6;--warnink:#6b4e00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--panel:#16242e;--ink:#e6eef2;--mute:#8fa2af;--line:#2a3b47;--bar:#1f5b53;--acc:#5fd0bd;--warn:#3a3116;--warnink:#f2d585}}
:root[data-theme="dark"]{--bg:#0f1a22;--panel:#16242e;--ink:#e6eef2;--mute:#8fa2af;--line:#2a3b47;--bar:#1f5b53;--acc:#5fd0bd;--warn:#3a3116;--warnink:#f2d585}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;line-height:1.1;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.banner{background:var(--warn);color:var(--warnink);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:600}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;height:120px;margin:12px 0 8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 15px Barlow,system-ui,sans-serif;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--acc)}
:root[data-theme="dark"] button:not(.ghost){color:#08201c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button:not(.ghost){color:#08201c}}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.err{color:#b3261e;font-weight:600;margin:6px 0 0}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
input[type=search]{flex:1 1 200px;max-width:320px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.count{color:var(--mute)}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:0;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th button{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 14px;cursor:pointer;font-weight:700;color:#fff;font-size:.9rem}
th button:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
thead th{background:#0b4f46}
th button[data-dir="1"]::after{content:" \25B2";font-size:.7em}
th button[data-dir="-1"]::after{content:" \25BC";font-size:.7em}
td.l{padding:10px 14px;font-weight:700;white-space:nowrap}
td.n{position:relative;padding:10px 14px;font-variant-numeric:tabular-nums}
td.n .b{position:absolute;left:0;top:4px;bottom:4px;background:var(--bar);border-radius:0 6px 6px 0}
td.n .v{position:relative}
td.e .v{color:var(--mute)}
.empty{padding:32px 16px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Team stats</h1>
  <p class="sub">Updates automatically from the Google Sheet. Tap a column heading to sort.</p>
  
  <p id="status" class="hint" role="status">Loading the sheet…</p>

  <div class="bar-top">
    <input id="q" type="search" placeholder="Search teams" aria-label="Search teams">
    <span id="count" class="count"></span>
  </div>
  <div class="wrap"><table id="tbl"></table></div>
</main>

<script>
const SAMPLE = "Team\tleave auto\tpark\thive tip auto\tAuto sum\tteleop hive tip\n" +
"1114\t1\t1\t3\t9\t14\n2056\t1\t0.8\t2\t7\t11\n254\t1\t1\t4\t12\t17\n1678\t0.9\t1\t3\t8.5\t15\n" +
"118\t1\t0.5\t1\t4\t8\n148\t0.7\t0.9\t2\t5.5\t9\n971\t1\t1\t5\t13\t19\n33\t0.6\t0.4\t0\t2\t6";
let head = [], rows = [], numeric = [], sortCol = -1, sortDir = -1, sample = true;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function splitLine(line, d) {
  if (d === "\t") return line.split("\t");
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === "," && !q) { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur); return out;
}

function load(text, isSample) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return "Include the header row and at least one row of data.";
  const d = text.includes("\t") ? "\t" : ",";
  const t = lines.map(l => splitLine(l, d).map(s => s.trim()));
  head = t[0].map((h, i) => h || (i === 0 ? "Team" : "Column " + (i + 1)));
  rows = t.slice(1).map(r => head.map((_, i) => {
    const v = r[i] === undefined ? "" : r[i];
    if (i === 0) return v;
    const n = parseFloat(v.replace(/,/g, ""));
    return isNaN(n) || /^#/.test(v) ? null : n;
  })).filter(r => r.some((v, i) => (i === 0 ? v !== "" : v !== null)))
    .map((r, k) => { if (r[0] === "") r[0] = "Row " + (k + 1); return r; });
  numeric = head.map((_, i) => i > 0 && rows.some(r => r[i] !== null));
  if (sortCol >= head.length) sortCol = -1;
  return "";
}

function render() {
  const term = $("q").value.trim().toLowerCase();
  let list = rows.filter(r => !term || String(r[0]).toLowerCase().includes(term));
  if (sortCol >= 0) list = list.slice().sort((a, b) => {
    const x = a[sortCol], y = b[sortCol];
    if (x === null) return 1; if (y === null) return -1;
    if (typeof x === "string") return sortDir * x.localeCompare(y, undefined, {numeric: true});
    return sortDir * (x - y);
  });
  const max = head.map((_, i) => numeric[i] ? Math.max(...rows.map(r => r[i] || 0)) : 0);
  let h = "<thead><tr>" + head.map((t, i) =>
    `<th scope="col"><button data-c="${i}"${i === sortCol ? ` data-dir="${sortDir}"` : ""}>${esc(t)}</button></th>`).join("") + "</tr></thead><tbody>";
  h += list.map(r => "<tr>" + r.map((v, i) => {
    if (i === 0) return `<td class="l">${esc(v)}</td>`;
    if (v === null) return `<td class="n e"><span class="v">&ndash;</span></td>`;
    const w = max[i] > 0 ? Math.max(2, v / max[i] * 100) : 0;
    return `<td class="n"><span class="b" style="width:${w}%"></span><span class="v">${Math.round(v * 100) / 100}</span></td>`;
  }).join("") + "</tr>").join("") + "</tbody>";
  $("tbl").innerHTML = h;
  if (!list.length) $("tbl").insertAdjacentHTML("afterend", "");
  $("count").textContent = list.length + " of " + rows.length + " teams";
}

$("tbl").addEventListener("click", e => {
  const b = e.target.closest("button[data-c]"); if (!b) return;
  const c = +b.dataset.c;
  if (sortCol === c) sortDir = -sortDir; else { sortCol = c; sortDir = c === 0 ? 1 : -1; }
  render();
});
$("q").addEventListener("input", render);
const SHEET_ID = "1npez8bGySZMKp5hjSmTajwj2ZAvQjgR7PTRRVU82hw0";
const TAB = "Sheet2";      // name of the tab to show (bottom of the sheet)
const EVERY = 30000;       // refresh interval in milliseconds

async function refresh() {
  try {
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:csv&headers=1&sheet=" + encodeURIComponent(TAB);
    const res = await fetch(url, {cache: "no-store"});
    if (!res.ok) throw new Error(res.status);
    const msg = load(await res.text());
    if (msg) { rows = []; head = []; render(); $("status").textContent = "No data in this tab yet."; return; }
    render();
    $("status").textContent = rows.length
      ? "Updated " + new Date().toLocaleTimeString() + ". Refreshes every " + EVERY / 1000 + " seconds."
      : "No data in this tab yet.";
  } catch (e) {
    $("status").textContent = "Could not load the sheet. Check that sharing is set to Anyone with the link, and that the tab name is right.";
  }
}
refresh();
setInterval(refresh, EVERY);
</script>
</body>
</html>
